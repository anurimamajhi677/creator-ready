# Cloudflare Pages config.
name = "creator-ready"
pages_build_output_dir = "./dist"
compatibility_date = "2025-01-01"

# Progress links. Create the namespace with:
#   npx wrangler kv namespace create PROGRESS
# then paste its id below.
[[kv_namespaces]]
binding = "PROGRESS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# The YouTube API key is a secret, never put it in this file:
#   npx wrangler pages secret put YOUTUBE_API_KEY
